<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>해뜸</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fcfcfd;
        color: #1a1523;
        font-family: -apple-system, "Pretendard", sans-serif;
        text-align: center;
        padding: 24px;
      }
      button {
        padding: 12px 24px;
        border-radius: 8px;
        border: none;
        background: #6f3de5;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <p>인터넷 연결을 확인할 수 없습니다.</p>
    <!-- Known, accepted limitation: the retry target is intentionally hardcoded
         to the production URL. capacitor.config.ts's server.url supports a
         CAPACITOR_SERVER_URL override for local dev/testing, but that override
         is a dev/test-only convenience never used in real distributed builds
         (which always point at production), so this static file is not
         templated to follow it. -->
    <button onclick="location.href = 'https://haetteum.kr'">다시 시도</button>
  </body>
</html>
