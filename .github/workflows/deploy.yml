name: deploy to ec2

on:
  push:
    branches:
      - main

concurrency:
  group: haetteum-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: deploy to ec2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          echo "===== ssh 설정 ====="

          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "===== ec2 배포 시작 ====="

          ssh \
            -o ConnectTimeout=10 \
            -i ~/.ssh/ec2.pem \
            ubuntu@"$EC2_HOST" << 'EOF'

            set -e

            echo "===== nvm 로드 ====="

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "===== node 버전 설정 ====="

            nvm use 24.19.0

            echo "node: $(node -v)"
            echo "pnpm: $(pnpm -v)"

            echo "===== 프로젝트 이동 ====="

            cd /home/ubuntu/haetteum

            echo "===== git pull ====="

            git pull --ff-only origin main

            echo "===== dependency install ====="

            pnpm install --frozen-lockfile

            echo "===== api build ====="

            pnpm --filter @haetteum/api build

            echo "===== web build ====="

            pnpm --filter @haetteum/web build

            echo "===== pm2 restart ====="

            pm2 startOrReload ecosystem.config.js

            pm2 save

            echo "===== pm2 status ====="

            pm2 status

            echo "===== deployment complete ====="

          EOF
