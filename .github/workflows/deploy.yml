name: deploy to ec2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: test ec2 ssh connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "===== 1. secret 확인 ====="

          if [ -z "$EC2_HOST" ]; then
            echo "EC2_HOST가 없습니다."
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "EC2_SSH_KEY가 없습니다."
            exit 1
          fi

          echo "secrets 정상"

          echo "===== 2. pem 파일 생성 ====="

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

          echo "===== 3. pem 파일 검증 ====="

          if ! ssh-keygen -y -f ~/.ssh/ec2.pem > /dev/null; then
            echo "EC2_SSH_KEY의 private key 형식이 잘못되었습니다."
            exit 1
          fi

          echo "pem 정상"

          echo "===== 4. EC2 22번 포트 확인 ====="

          nc -vz -w 10 "$EC2_HOST" 22

          echo "===== 5. EC2 host key 확인 ====="

          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "===== 6. 실제 SSH 접속 ====="

          ssh \
            -o ConnectTimeout=10 \
            -i ~/.ssh/ec2.pem \
            ubuntu@"$EC2_HOST" \
            'echo "SSH CONNECTION SUCCESS"'