name: deploy to ec2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: deploy to ec2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2.pem ubuntu@"$EC2_HOST" << 'EOF'
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            nvm use 24.19.0

            cd /home/ubuntu/haetteum

            echo "===== git pull ====="
            git pull --ff-only origin main

            echo "===== install ====="
            pnpm install --frozen-lockfile

            echo "===== api build ====="
            pnpm --filter @haetteum/api build

            echo "===== web build ====="
            pnpm --filter @haetteum/web build

            echo "===== pm2 restart ====="
            pm2 restart haetteum-api --update-env
            pm2 restart haetteum-web --update-env

            pm2 save

            echo "===== deployment complete ====="
          EOF