name: Terraform validation

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-*.yml"
  push:
    branches: [codex/terraform-foundation]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        root: [bootstrap, access, environments/production]
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Terraform version
        id: version
        shell: bash
        run: echo "value=$(cat infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.version.outputs.value }}
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize provider without backend
        working-directory: infra/terraform/${{ matrix.root }}
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        working-directory: infra/terraform/${{ matrix.root }}
        run: terraform validate -no-color
      - name: Test infrastructure controls without AWS
        if: matrix.root != 'environments/production'
        working-directory: infra/terraform/${{ matrix.root }}
        run: terraform test -no-color
